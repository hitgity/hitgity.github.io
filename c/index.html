<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐리어 잼 도전장 · Carrier Jam</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="친구가 보낸 캐리어 잼 링크 · Carrier Jam">
<meta property="og:description" content="도전장 · 하트 선물 · 친구 초대 — 항공모함 갑판의 전투기를 순서대로 출격시키는 퍼즐 게임">
<meta property="og:image" content="https://hitgity.github.io/c/og.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="500">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b1724">
<style>
:root { --ink:#0b1724; --navy:#15314f; --line:rgba(159,200,236,.22); --paper:#f3f6f9; --muted:#a9bdd1; --yellow:#ffc93c; --navy3:#21507a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: radial-gradient(120% 80% at 50% 0%, #1f86b8 0%, #0b4f7a 45%, #0b1724 100%) fixed; color: var(--paper);
  font: 16px/1.55 "Pretendard","Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","PingFang TC","PingFang SC","Malgun Gothic",system-ui,sans-serif; word-break: keep-all; }
main { max-width: 440px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 16px calc(36px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
/* Japanese and Chinese have no spaces: keep-all would make a whole sentence one unbreakable line */
:root:lang(ja) body, :root:lang(zh-Hant) body, :root:lang(zh-Hans) body { word-break: normal; line-break: strict; }
:root:lang(ja) main { word-break: auto-phrase; } /* Chrome 119+: breaks between phrases, not inside words */
main > *, .card > *, .btn { min-width: 0; overflow-wrap: anywhere; }
.btn { text-align: center; padding: 6px 14px; }
.mark { justify-self: center; display: flex; align-items: center; gap: 10px; font: 900 30px/1 "Arial Black",system-ui,sans-serif; letter-spacing: .02em; text-shadow: 0 3px 0 var(--ink); }
.mark b { background: var(--yellow); color: var(--ink); padding: 6px 10px 4px; border-radius: 8px; transform: rotate(-2deg); text-shadow: none; box-shadow: 0 3px 0 var(--ink); }
h1 { margin: 0; text-align: center; font-size: 22px; line-height: 1.35; text-wrap: balance; }
.card { position: relative; overflow: hidden; border-radius: 22px; background: var(--navy); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 34px 18px 22px; text-align: center; display: grid; gap: 6px; }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 12px; background: linear-gradient(var(--yellow), var(--yellow)) bottom / 100% 2px no-repeat, repeating-linear-gradient(-45deg, #2c6390 0 12px, #17406a 12px 24px); }
.pill { justify-self: center; background: var(--navy3); color: var(--yellow); box-shadow: inset 0 0 0 1.5px rgba(255,201,60,.7); font-weight: 800; font-size: 14px; padding: 4px 14px; border-radius: 999px; }
.label { color: var(--muted); font-size: 14px; font-weight: 700; margin-top: 6px; }
.score { font: 900 clamp(48px, 17vw, 76px)/1.05 "Arial Black",system-ui,sans-serif; color: var(--yellow); text-shadow: 0 4px 0 var(--ink); font-variant-numeric: tabular-nums; }
.rank { font-weight: 800; font-size: 17px; }
.rank span { margin-left: 6px; padding: 2px 9px; border-radius: 10px; background: rgba(53,201,122,.18); color: #8ff0bb; font-size: 14px; }
.tease { color: #ffd75e; font-weight: 800; font-size: 17px; margin-top: 4px; }
.btns { display: grid; gap: 12px; }
.btn { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; font-weight: 900; font-size: 18px; text-decoration: none; }
.btn.primary { background: var(--yellow); color: var(--ink); box-shadow: 0 5px 0 #d99b14; }
.btn.dark { background: rgba(11,23,36,.7); color: var(--paper); border: 1px solid var(--line); }
.note { margin: 0; color: var(--muted); font-size: 13.5px; text-align: center; text-wrap: pretty; }
.bad { text-align: center; color: var(--paper); }
.fcard { padding-top: 30px; }
.heart { font-size: 64px; line-height: 1; color: #ff5a6e; text-shadow: 0 4px 0 var(--ink); }
.fbody { margin: 6px 0 0; font-weight: 700; font-size: 16px; color: var(--paper); text-wrap: pretty; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="mark">CARRIER <b>JAM</b></div>
  <h1 id="head"></h1>
  <section class="card" id="card" hidden>
    <span class="pill" id="mode"></span>
    <span class="label" id="label"></span>
    <span class="score" id="score"></span>
    <span class="rank" id="rank" hidden></span>
    <span class="tease" id="tease"></span>
  </section>
  <section class="card fcard" id="fcard" hidden>
    <span class="heart" aria-hidden="true">❤</span>
    <p class="fbody" id="fbody"></p>
  </section>
  <p class="bad" id="bad" hidden></p>
  <div class="btns">
    <a class="btn primary" id="open" hidden></a>
    <a class="btn dark" id="store"></a>
  </div>
  <p class="note" id="note"></p>
</main>
<script>
(function () {
  var T = {"ko":{"fInv":"친구가 캐리어 잼에 초대했어요","fReq":"친구가 하트를 요청했어요","fGift":"친구가 하트를 보냈어요","fInvBody":"앱에서 열면 친구 목록에 추가되고, 매일 하트를 주고받을 수 있어요.","fReqBody":"앱에서 열어 하트를 보내 주세요. 보내도 내 하트는 줄지 않아요.","fGiftBody":"앱에서 열면 하트 1개를 받아요. 보낸 다음 날까지 받을 수 있어요.","fOpen":"앱에서 열기","title":"캐리어 잼 도전장","app":"캐리어 잼","head":"친구의 도전장이 도착했어요!","mode":"무한 출격","label":"넘어야 할 점수","rank":"전체 {n}위","top":"상위 {p}%","tease":"이 점수, 넘을 수 있을까요? 😏","open":"앱에서 도전하기","store":"Google Play에서 받기","note":"앱을 설치하고 처음 열면 도전장이 바로 들어가요. 안 보이면 설치 후 이 링크를 다시 눌러 주세요.","other":"캐리어 잼은 Android(Google Play) 게임이에요.","bad":"링크가 올바르지 않아요. 받은 링크를 그대로 열어 주세요.","desc":"항공모함 갑판의 전투기를 순서대로 출격시키는 퍼즐 게임"},"en":{"fInv":"A friend invited you to Carrier Jam","fReq":"A friend asked for a heart","fGift":"A friend sent you a heart","fInvBody":"Open it in the app to add them and swap a heart every day.","fReqBody":"Open it in the app to send a heart. Sending one costs you nothing.","fGiftBody":"Open it in the app to get 1 heart. It can be taken until the day after it was sent.","fOpen":"Open in the app","title":"Carrier Jam challenge","app":"Carrier Jam","head":"A friend has challenged you!","mode":"Endless","label":"Score to beat","rank":"Rank #{n}","top":"Top {p}%","tease":"Think you can beat it? 😏","open":"Take it on in the app","store":"Get it on Google Play","note":"Install the game and open it: the challenge is waiting. If not, tap this link again after installing.","other":"Carrier Jam is an Android game on Google Play.","bad":"This link is not valid. Please open it exactly as you received it.","desc":"Launch every jet off a crowded carrier deck, in the right order"},"ja":{"fInv":"友だちがキャリアジャムに招待しました","fReq":"友だちがハートをリクエストしています","fGift":"友だちからハートが届きました","fInvBody":"アプリで開くと友だちに追加され、毎日ハートを送り合えます。","fReqBody":"アプリで開いてハートを送ってください。送っても自分のハートは減りません。","fGiftBody":"アプリで開くとハートを1個受け取れます。送信の翌日まで受け取れます。","fOpen":"アプリで開く","title":"キャリアジャム 挑戦状","app":"キャリアジャム","head":"友だちから挑戦状が届きました！","mode":"エンドレス出撃","label":"超えるべきスコア","rank":"全体 {n}位","top":"上位{p}%","tease":"このスコア、超えられるかな？ 😏","open":"アプリで挑戦する","store":"Google Play で入手","note":"インストールして最初に開くと挑戦状が届いています。表示されない場合は、インストール後にこのリンクをもう一度タップしてください。","other":"キャリアジャムは Android（Google Play）のゲームです。","bad":"リンクが正しくありません。受け取ったリンクをそのまま開いてください。","desc":"空母の甲板の戦闘機を順番に出撃させるパズルゲーム"},"zh-Hant":{"fInv":"朋友邀請你玩 Carrier Jam","fReq":"朋友向你要愛心","fGift":"朋友送你一顆愛心","fInvBody":"在應用程式中開啟就會加為朋友，每天可以互送愛心。","fReqBody":"在應用程式中開啟並送出愛心，送出不會減少自己的愛心。","fGiftBody":"在應用程式中開啟即可領取1顆愛心，隔天前都可以領取。","fOpen":"在應用程式中開啟","title":"Carrier Jam 戰帖","app":"Carrier Jam","head":"朋友向你下戰帖了！","mode":"無盡出擊","label":"要超越的分數","rank":"總排名第{n}名","top":"前{p}%","tease":"你超得過這個分數嗎？ 😏","open":"在 App 中挑戰","store":"在 Google Play 下載","note":"安裝後第一次開啟，戰帖就會出現。如果沒有，請在安裝後再點一次這個連結。","other":"Carrier Jam 是 Android（Google Play）遊戲。","bad":"連結不正確，請直接開啟收到的連結。","desc":"依序讓航艦甲板上的戰機出擊的解謎遊戲"},"zh-Hans":{"fInv":"朋友邀请你玩 Carrier Jam","fReq":"朋友向你要爱心","fGift":"朋友送你一颗爱心","fInvBody":"在应用中打开就会加为朋友，每天可以互送爱心。","fReqBody":"在应用中打开并送出爱心，送出不会减少自己的爱心。","fGiftBody":"在应用中打开即可领取1颗爱心，第二天前都可以领取。","fOpen":"在应用中打开","title":"Carrier Jam 战书","app":"Carrier Jam","head":"朋友向你下战书了！","mode":"无尽出击","label":"要超越的分数","rank":"总排名第{n}名","top":"前{p}%","tease":"你能超过这个分数吗？ 😏","open":"在 App 中挑战","store":"在 Google Play 下载","note":"安装后第一次打开，战书就会出现。如果没有，请在安装后再点一次这个链接。","other":"Carrier Jam 是 Android（Google Play）游戏。","bad":"链接不正确，请直接打开收到的链接。","desc":"让航母甲板上的战机依次出击的解谜游戏"}};
  var APP = "com.carrierjam.app";
  var l = (navigator.language || 'ko').toLowerCase();
  var lang = l.indexOf('ko') === 0 ? 'ko' : l.indexOf('ja') === 0 ? 'ja' : l.indexOf('zh') === 0 ? (/hans/.test(l) ? 'zh-Hans' : /hant|-tw|-hk|-mo/.test(l) ? 'zh-Hant' : 'zh-Hans') : 'en';
  var t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  function $(id) { return document.getElementById(id); }
  // the same check code the game uses (meta/challenge.ts)
  function fnv6(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8).slice(0, 6);
  }

  var s = num(q.get('s')), r = num(q.get('r')), n = num(q.get('t'));
  if (!r || r <= 0) r = null;
  if (!r || !n || n < r) n = null;
  var ok = !!s && (q.get('k') || '').toLowerCase() === fnv6('carrier-jam/challenge/1|' + s + '|' + (r || '') + '|' + (n || ''));
  // friend links (meta/friends.ts): an invite, a heart request or a heart gift
  function code(v) { return v && /^[2-9A-HJKMNP-Z]{6}$/i.test(v) ? v.toUpperCase() : null; }
  var day = q.get('d'), dOk = !!day && /^\d{8}$/.test(day), kind = null, sig = '';

  else if (code(q.get('fg')) && code(q.get('to')) && dOk) { kind = 'gift'; sig = 'g|' + code(q.get('fg')) + '|' + code(q.get('to')) + '|' + day; }
  var fok = !ok && !!kind && (q.get('k') || '').toLowerCase() === fnv6('carrier-jam/friend/1|' + sig);

        var p = (r / n) * 100;
        p = p < 10 ? Math.max(0.1, Math.ceil(p * 10 - 1e-9) / 10) : Math.ceil(p - 1e-9);

      $('rank').hidden = false;

})();

</body>
</html>
